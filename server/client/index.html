<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Image Search</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    input {
      width: 60%;
      padding: 8px;
    }

    button {
      padding: 8px 12px;
    }

    .results {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .card {
      width: 200px;
      border: 1px solid #ddd;
      padding: 8px;
    }

    .card img {
      width: 100%;
      height: 120px;
      object-fit: cover
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const e = React.createElement;
    function App() {
      const [query, setQuery] = React.useState('');
      const [results, setResults] = React.useState([]);
      const [loading, setLoading] = React.useState(false);

      async function doSearch() {
        setLoading(true);
        try {
          const res = await fetch('/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query, topK: 10 })
          });
          const data = await res.json();
          setResults(data.results || []);
        } catch (err) {
          alert('Search failed: ' + err);
        } finally { setLoading(false); }
      }

      return e('div', null,
        e('h1', null, 'Image Search'),
        e('div', null,
          e('input', { value: query, onChange: (ev) => setQuery(ev.target.value), placeholder: 'Enter search text' }),
          e('button', { onClick: doSearch, disabled: loading }, loading ? 'Searching...' : 'Search')
        ),
        e('div', { className: 'results' },
          results.map((r, idx) => e('div', { key: idx, className: 'card' },
            e('img', { src: r.url, alt: r.key }),
            e('div', null, r.key),
            e('div', null, 'score: ' + (r.score || 0).toFixed(4))
          ))
        )
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(e(App));
  </script>
</body>
</html>
